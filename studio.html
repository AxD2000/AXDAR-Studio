<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXDAR Studio</title><link rel="stylesheet" href="/workspaces.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('axdar.theme')==='cream'?'cream':'dark'}catch{}</script></head><body><canvas id="pointer-field" aria-hidden="true"></canvas><div class="shell"><aside><div class="brand"><span class="logo">◈</span> AXDAR STUDIO</div><nav id="nav" aria-label="Workspaces"></nav><div class="sidefoot"><small>Current episode</small><strong id="projectTitle"></strong><small id="projectCount"></small></div></aside><main class="main"><div class="global"><select id="episodeMenu" aria-label="Current episode"></select><div class="row"><span class="status" id="saved" role="status"></span><button id="theme"></button></div></div><div class="workspace-title"><h1 id="heading"></h1><p id="caption"></p></div><div id="notice" role="alert"></div><input id="fileImport" type="file" multiple hidden><input id="workflowInput" type="file" accept=".json,application/json" hidden><input id="storyFile" type="file" accept=".txt,.md,.fountain,.docx,.pdf" hidden><input id="metadataFile" type="file" accept=".json,application/json" hidden><dialog id="workflowTools" aria-labelledby="workflowToolsTitle"><h2 id="workflowToolsTitle">Jupyter Terminal commands</h2><p>Runs Bash commands on the connected Vast instance. Same machine as Jupyter; no second connection.</p><label>Hugging Face token<input id="hfToken" type="password" autocomplete="off" placeholder="hf_..."></label><button data-connection="hf">Save HF token securely</button><small id="hfSaved" role="status"></small><label>Bash command<textarea id="remoteCommand" maxlength="4096" rows="6" placeholder="Paste your Jupyter Terminal command here"></textarea></label><button data-connection="command">Run once</button><pre id="remoteOutput" role="status" style="white-space:pre-wrap;max-height:40vh;overflow:auto"></pre><small>25-second command limit, 64 KiB output. HF_TOKEN is available to this command. Long downloads and interactive programs need Jupyter Terminal.</small><button data-tools="close">Close</button></dialog><div id="app"></div></main></div><script src="/workspaces.js"></script><script src="/connection-ui.js"></script><script src="/production-ui.js"></script><script src="/story-ui.js"></script><script src="/workflow-ui.js"></script><script src="/editor-ui.js"></script><script defer src="/plugin-manager.js"></script><script>const translations={"المدة من دقيقتين إلى ١٤٤٠ دقيقة": "Set a session length between 2 and 1,440 minutes.", "اعتمد لقطة واحدة على الأقل": "Approve at least one shot first.", "أدخل رابط ComfyUI": "Enter a valid ComfyUI URL.", "الجلسة تعمل حالياً": "A session is already running.", "المشروع أكبر من الحجم المسموح": "The project exceeds the save limit.", "راجع صورة وبرومبت ومدة اللقطة ": "Check the image, prompt and duration of shot ", "العامل ما رجّع MP4 من عقدة الإخراج 141": "The worker returned no MP4 from output node 141.", "حافظ على شكل الشخصية وملابسها حسب الصورة الأساسية المختارة.": "Keep the character’s appearance and wardrobe consistent with the selected primary image.", "حافظ على ترتيب أثاث الغرفة واتجاه الإضاءة.": "Preserve the furniture layout and lighting direction.", "الكاميرا ثابتة أثناء الحوار.": "Keep the camera still during dialogue.", "حلقة جديدة": "New episode"};
function localize(text){for(const [key,value] of Object.entries(translations))if(text?.startsWith(key))return value+text.slice(key.length);return text}

const studioToken='__TOKEN__';
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,assets,ep,page=0,state={results:[]},saveQueue=Promise.resolve(),timer,editsPending=false,saveError='';

const aliases={'Grumpy Orange Tabby Character Sheet.png':'Orange tabby','Golden Retriever Character Turnaround Sheet (1).png':'Golden retriever','Cozy Sunlit Traditional Living Room.png':'Living room','emma.png':'Emma','jack.png':'Jack','tobby.png':'Tobby','emma.mp3':'Emma · voice','jack.mp3':'Jack · voice','tom.mp3':'Tom · voice'};
const name=f=>aliases[f]||f, audio=f=>/\.(mp3|wav|ogg|m4a|flac)$/i.test(f), images=()=>assets.filter(f=>!audio(f)), src=f=>'/asset/'+encodeURIComponent(f);
function option(v,t,selected){return '<option value="'+esc(v)+'" '+(v===selected?'selected':'')+'>'+esc(t)+'</option>'}
async function post(path,obj){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Studio':'__TOKEN__'},body:JSON.stringify(obj)});let data=await r.json();if(!r.ok)throw Error(localize(data.error)||r.status);return data}
function save(){
    clearTimeout(timer);timer=null;
    const snapshot=structuredClone(db);
    editsPending=false;$('#saved').textContent='Saving…';
    saveQueue=saveQueue.then(()=>post('/save',{...snapshot,_edit:db._edit})).then(result=>{
        db._edit=result.edit;saveError='';
        if(!editsPending)$('#saved').textContent='Saved locally';
    }).catch(e=>{saveError=e.message;editsPending=true;$('#saved').textContent='Save failed: '+saveError});
    return saveQueue;
}
function dirty(){editsPending=true;clearTimeout(timer);$('#saved').textContent='Unsaved changes';timer=setTimeout(save,300)}
window.addEventListener('pagehide',()=>{if(db&&!migrationNeeded()&&editsPending)fetch('/save',{method:'POST',headers:{'X-Studio':studioToken},body:JSON.stringify(db),keepalive:true}).catch(()=>{})});
function episode(){return {id:uid(),title:'New episode',story:'',scenes:[],shots:[],story_imports:[]}}
function versions(s){return state.results.filter(v=>v.episode===ep.id&&v.id===s.id)}
const statuses={submitting:'Submitting',uncertain:'Check original submission',done:'Complete',error:'Technical error',queued:'Rendering',preparing:'Preparing references',waiting:'Waiting to resume'};
function results(s){
    return versions(s).map((v,i)=>{
        const playable=v.video||(page===3&&v.preview);
        return '<div><hr><strong>Take '+(i+1)+' · '+esc(statuses[v.status])+'</strong>'+
          (v.error?'<p class="danger">'+esc(localize(v.error))+'</p>':'')+
          (playable?'<video controls preload="metadata" src="'+esc(playable)+'"></video>':'')+
          (page===3?'':(v.video?'<button data-review-retake="'+esc(s.id)+'">Retake shot</button>':'')+takeReview(v))+'</div>';
    }).join('');
}
function bible(){return '<section class="panel"><h2>Continuity rules</h2><p>Choose when each rule applies. Matching rules appear in the final shot prompt.</p>'+db.rules.map((r,i)=>'<div class="rule" data-rule="'+i+'"><select data-scope>'+option('all','All shots',r.scope)+option('dialog','Dialogue shots',r.scope)+assets.map(f=>option(f,name(f),r.scope)).join('')+'</select><textarea data-text>'+esc(translations[r.text]||r.text)+'</textarea><button data-remove="'+i+'">Remove</button></div>').join('')+'<button id="newRule">+ Add rule</button></section>'}


function libraryView(){
    return ['photo','voice'].map(kind=>{
        const voice = kind==='voice', items=assets.filter(f=>audio(f)===voice);
        const tiles=items.map(f=>{
            const title=esc(name(f)), url=esc(src(f));
            const preview=voice?'<audio controls preload="none" src="'+url+'"></audio>':'<img loading="lazy" alt="'+title+'" src="'+url+'">';
            return '<figure>'+preview+'<figcaption>'+title+'</figcaption><button data-drop-file="'+esc(f)+'" aria-label="Delete '+title+'">Delete</button></figure>';
        }).join('');
        return '<section class="panel"><div class="top"><h2>'+(voice?'Voices':'Reference photos')+'</h2><button class="primary" data-import="'+kind+'">+ Add '+(voice?'voices':'photos')+'</button></div><div class="gallery '+(voice?'voices':'')+'">'+(tiles||'<p>No files yet.</p>')+'</div></section>';
    }).join('');
}
async function importFiles(input){
    const kind=input.dataset.kind;
    let count=0;
    try{
        for(const file of input.files){
            const valid=kind==='voice'?audio(file.name):/\.(png|jpe?g|webp|avif)$/i.test(file.name);
            if(!valid)throw Error('Unsupported '+kind+' file: '+file.name);
            const response=await fetch('/library/upload',{method:'POST',headers:{'X-Studio':'__TOKEN__','X-Filename':encodeURIComponent(file.name)},body:file});
            const info=await response.json();
            if(!response.ok)throw Error(info.error||'Upload failed.');
            assets.push(info.name);
            count++;
        }
        $('#saved').textContent=count+' file'+(count===1?'':'s')+' added';
    }catch(error){$('#notice').textContent=error.message}
    finally{input.value='';render()}
}

function sessionView(){
    const approved=ep.shots.filter(s=>s.approved).length;
    const session=state.session?.episode===ep.id?state.session:null;
    const canSubmit=state.connection?.state==='Ready'&&approved&&!state.running&&!state.workflowError;
    return connectionPanel()+
      '<section class="panel"><h2>Direct ComfyUI submission</h2><p>'+approved+' approved shots in '+esc(ep.title)+'</p>'+
      '<p>'+esc(state.workflow||'')+'</p>'+
      '<button class="primary" id="start" '+(canSubmit?'':'disabled')+'>Submit approved shots</button>'+
      (state.workflowError?'<p class="danger">'+esc(state.workflowError)+'</p>':'')+
      (session?'<p role="status">'+esc(session.phase)+' · '+session.completed+'/'+session.submitted+' complete'+
        (session.failed?' · '+session.failed+' failed':'')+'</p>':'')+
      (session?.error?'<p class="danger">'+esc(localize(session.error))+'</p>':'')+'</section>'+
      '<section class="panel"><h2>Shot history</h2>'+ep.shots.filter(s=>versions(s).length).map(s=>
        '<div><strong>'+heading(s,ep.shots.indexOf(s))+'</strong>'+results(s)+'</div>').join('')+'</section>';
}
function invalidate(s){s.revision=uid();s.approved=false}
function ruleEdit(action){
    action();
    for(const e of db.episodes)for(const s of e.shots)if(s.approved)invalidate(s);
}
document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='title')ep.title=t.value;
    else if(t.closest('[data-rule]')){
        const r=db.rules[Number(t.closest('[data-rule]').dataset.rule)];
        ruleEdit(()=>r[t.hasAttribute('data-scope')?'scope':'text']=t.value);
    }else return;
    dirty();
});
document.addEventListener('change',e=>{
    if(e.target.id==='fileImport')importFiles(e.target);
    if(e.target.id==='title'){$('#projectTitle').textContent=ep.title;const current=$('#episodeMenu').selectedOptions[0];if(current)current.textContent=(db.episodes.indexOf(ep)+1)+'. '+ep.title}
});
document.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;
    try{
        if(b.hasAttribute('data-page')){page=Number(b.dataset.page);render();return}
        if(b.dataset.import){
            const input=$('#fileImport');input.dataset.kind=b.dataset.import;
            input.accept=b.dataset.import==='voice'?'.mp3,.wav,.m4a,.ogg,.flac':'.png,.jpg,.jpeg,.webp,.avif';
            input.click();return;
        }
        if(b.hasAttribute('data-drop-file')){
            const file=b.dataset.dropFile;
            if(!confirm('Remove '+name(file)+' from the library and associated references?'))return;
            const updated=await projectAction('/library/remove',{name:file});
            assets=updated.assets;render();return;
        }
        if(b.id==='newEp'){await projectAction('/project/episode',{title:'New episode'});ep=db.episodes.at(-1);selectedId='';render();return}
        else if(b.id==='newRule')db.rules.push({scope:'all',text:''});
        else if(b.hasAttribute('data-remove'))ruleEdit(()=>db.rules.splice(Number(b.dataset.remove),1));
        else if(b.id==='start'){
            b.disabled=true;
            try{
                await flushEdits();
                const submission=await post('/start',{episode:ep.id});
                state=await(await fetch('/status')).json();render();reportSubmission(submission);
            }finally{b.disabled=false}
            return;
        }else return;
        await save();render();
    }catch(err){reportError(err)}
});
(async()=>{
    const data=await(await fetch('/api')).json();
    migration=data.migration;db=data.project;assets=data.assets;ep=db.episodes.at(-1);
    state=await(await fetch('/status')).json();
    if(!migrationNeeded()&&!ep){await projectAction('/project/episode',{title:'New episode'});ep=db.episodes.at(-1)}
    if(!migrationNeeded())await loadWorkflows();
    render();
    setInterval(async()=>{
        try{
            const next=await(await fetch('/status')).json(),changed=JSON.stringify(state)!==JSON.stringify(next);
            const previous=state;
            state=next;
            if(changed&&!migrationNeeded())prepareFinishedFreecutEpisodes(previous,next);
            if(changed&&!migrationNeeded()&&(page===3&&![...document.querySelectorAll('video')].some(video=>!video.paused)||page===5)&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('#workflowFields[open]'))render();
        }catch{}
    },4000);
})().catch(reportError);
const themeButton = document.querySelector('#theme');
function showTheme() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeButton.textContent = dark ? '☀  Cream' : '☾  Dark mode';
    themeButton.setAttribute('aria-label', dark ? 'Switch to cream theme' : 'Switch to dark mode');
}
themeButton.addEventListener('click', () => {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'cream' : 'dark';
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('axdar.theme', theme);if($('#themeChoice'))$('#themeChoice').value=theme; } catch {}
    showTheme();
});
showTheme();

const field = document.querySelector('#pointer-field');
const brush = field.getContext('2d');
const allowed = matchMedia('(any-pointer:fine) and (prefers-reduced-motion:no-preference)');
let motes = [], frame = 0, lastX, lastY, lastTime = 0;
function resizeField() {
    const scale = Math.min(devicePixelRatio || 1, 2);
    field.width = Math.round(innerWidth * scale);
    field.height = Math.round(innerHeight * scale);
    brush.setTransform(scale, 0, 0, scale, 0, 0);
}
function paintMotes(now) {
    brush.clearRect(0, 0, innerWidth, innerHeight);
    motes = motes.filter(p => now - p.born < 620);
    const dark = document.documentElement.dataset.theme === 'dark';
    for (const p of motes) {
        const age = Math.max(0, (now - p.born) / 620);
        brush.fillStyle = (dark ? ['#d6c7ff','#f3d7a0','#c5dcc8'] : ['#7861b6','#977337','#5a7f76'])[p.tint];
        brush.globalAlpha = .64 * (1-age) ** 1.45;
        brush.beginPath();
        brush.arc(p.x + p.dx*age, p.y + p.dy*age - 8*age*age, p.size*(1-age*.6), 0, Math.PI*2);
        brush.fill();
    }
    brush.globalAlpha = 1;
    frame = motes.length ? requestAnimationFrame(paintMotes) : 0;
}
function stopField() {
    cancelAnimationFrame(frame); frame=0; motes=[]; lastX=lastY=undefined;
    brush.clearRect(0,0,innerWidth,innerHeight);
}
window.addEventListener('pointermove', e => {
    if (!allowed.matches || e.pointerType === 'touch') return;
    const now = performance.now(), x=e.clientX, y=e.clientY;
    if (lastX !== undefined && (now-lastTime<12 || Math.hypot(x-lastX,y-lastY)<3)) return;
    const heading = Math.atan2(y-(lastY??y), x-(lastX??x));
    lastX=x; lastY=y; lastTime=now;
    for(let k=0;k<3;k++) {
        const angle=heading+Math.PI+(Math.random()-.5)*2.8;
        const distance=6+Math.random()*17;
        motes.push({x:x+Math.cos(angle)*6,y:y+Math.sin(angle)*6,born:now,dx:Math.cos(angle)*distance,dy:Math.sin(angle)*distance,size:1+Math.random()*1.8,tint:k});
    }
    if(motes.length>96)motes.splice(0,motes.length-96);
    if(!frame)frame=requestAnimationFrame(paintMotes);
},{passive:true});
window.addEventListener('resize',resizeField);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopField()});
allowed.addEventListener('change',stopField);
resizeField();
</script></html>
